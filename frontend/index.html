<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2316a34a'><path d='M12 2L1 7l11 5 9-4.09V17h2V7L12 2z'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Biringan Science and Leadership Academy (BSLA) | Admissions & Student Portal</title>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased font-sans selection:bg-brand-500 selection:text-white">
    <div id="app"></div>
    <script>
      // Fallback: If accessed directly via Apache without Vite dev server, redirect to built dist
      if (window.location.port !== '5173' && window.location.pathname.includes('/frontend') && !window.location.pathname.includes('/dist')) {
        window.location.replace(window.location.pathname.replace(/\/frontend(\/.*)?$/, '/frontend/dist/'));
      }
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
